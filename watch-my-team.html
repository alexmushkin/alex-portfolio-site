<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,800;9..144,900&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=26">
  <title>Watch My Team · Alex Mushkin's Portfolio</title>
</head>
<body>
  <div id="site-header"></div>

  <main>
    <header class="page-head">
      <div class="wrap">
        <p class="eyebrow"><a href="sports.html">Sports</a></p>
        <h1>Watch My Team</h1>
        <p>An app I built to answer one question: how do I watch my team this season? Pick any team to see where its games air, which services you need, and what it will cost.</p>
        <a class="app-button" href="https://watch.alexmushkin.com" target="_blank" rel="noopener">Open full app <span aria-hidden="true">↗</span></a>
      </div>
    </header>

    <section class="page-body">
      <div class="wrap">
        <!-- quirk: the app plays on a little cartoon TV (the antenna wiggles when you hover it) -->
        <div class="tv">
          <div class="tv-antenna" aria-hidden="true"><span></span><span></span></div>
          <div class="tv-screen">
            <iframe src="https://watch.alexmushkin.com" title="Watch My Team app" loading="lazy"
                    allow="geolocation" referrerpolicy="strict-origin-when-cross-origin"></iframe>
          </div>
        </div>
        <p class="tv-note">Signing in? It works best in the <a href="https://watch.alexmushkin.com" target="_blank" rel="noopener">full app</a>.</p>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="js/site.js?v=26"></script>
  <script src="js/quirks.js?v=26"></script>
</body>
</html>
