<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,800;9..144,900&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=26">
  <title>Alex Mushkin's Portfolio</title>
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="hero">
      <!-- The title shows in the header; this copy is for screen readers and search engines. -->
      <h1 class="visually-hidden">Alex Mushkin's Portfolio</h1>

      <div class="stage-area">
        <!-- Drawn and animated by js/hero-animation.js -->
        <svg id="stage" class="stage" viewBox="0 0 1000 420" role="img" tabindex="0"
             aria-label="A typewriter types Creative Writing and Sports; scissors cut them out and they float up into the menu. A stick figure dribbles the typewriter until it turns into a basketball, then hops down into the footer, still dribbling. Click to pause.">
          <g id="scene">
            <line id="ground" class="ink" x1="-3000" y1="360" x2="4000" y2="360"/>
            <g id="ground-ticks"></g>

            <ellipse id="ball-shadow" class="shadow" cx="500" cy="362" rx="20" ry="4"/>

            <!-- typewriter -->
            <g id="tw-paper">
              <rect class="ink paper" x="390" y="40" width="220" height="168" rx="3"/>
              <text id="tw-line1" class="typed" x="400" y="172"></text>
              <text id="tw-line2" class="typed" x="400" y="198"></text>
            </g>
            <g id="tw-roller">
              <rect class="ink roller" x="320" y="195" width="360" height="30" rx="15"/>
              <circle class="ink knob" cx="314" cy="210" r="18"/>
              <circle class="ink knob" cx="686" cy="210" r="18"/>
            </g>
            <rect id="tw-body" class="ink" x="355" y="230" width="290" height="130" rx="18"/>
            <g id="tw-keys"></g>

            <!-- stick figure -->
            <g id="figure" class="figure">
              <polyline id="arm-back"/>
              <polyline id="leg-back"/>
              <line id="torso"/>
              <polyline id="leg-front"/>
              <circle id="head" r="13"/>
              <circle id="eye-l" class="eye" r="1.8"/>
              <circle id="eye-r" class="eye" r="1.8"/>
              <polyline id="arm-front"/>
            </g>

            <!-- ball (appears once the typewriter finishes morphing) -->
            <g id="ball">
              <circle class="ink ball-fill" r="25"/>
              <path class="seam" d="M0,-25V25M-25,0H25M-17,-18Q-7,0 -17,18M17,-18Q7,0 17,18"/>
            </g>
          </g>
        </svg>

        <!-- Bio, shown once the animation ends -->
        <div id="after-shot" class="after-shot">
          <div class="wrap">
            <p class="bio">I am currently pursuing a master's in Sports Industry Management at Georgetown University. I like operating at the cross-section of art, athletics, and technology and want to build something meaningful in these spaces.</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="js/site.js?v=26"></script>
  <script src="js/quirks.js?v=26"></script>
  <script src="js/hero-animation.js?v=26"></script>
</body>
</html>
